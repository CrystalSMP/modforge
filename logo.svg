<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ModForge AI">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4fe0d4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4fe0d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ee07f"/>
      <stop offset="1" stop-color="#4fae3e"/>
    </linearGradient>
  </defs>

  <!-- cube: top face -->
  <polygon points="30,10 54,22 30,34 6,22" fill="url(#top)"/>
  <!-- pixel pattern on top -->
  <polygon points="30,14 34,16 30,18 26,16" fill="#a6ec96"/>
  <polygon points="42,20 46,22 42,24 38,22" fill="#3f9a33"/>
  <polygon points="18,20 22,22 18,24 14,22" fill="#6fc35a"/>
  <polygon points="30,26 34,28 30,30 26,28" fill="#3f9a33"/>

  <!-- left face (dirt + grass rim) -->
  <polygon points="6,22 30,34 30,60 6,48" fill="#8a5a30"/>
  <polygon points="6,22 30,34 30,40 6,28" fill="#5aa845"/>
  <polygon points="10,28 14,30 14,34 10,32" fill="#5aa845"/>
  <polygon points="22,34 26,36 26,40 22,38" fill="#5aa845"/>
  <polygon points="12,38 16,40 16,44 12,42" fill="#6b4224"/>
  <polygon points="20,46 24,48 24,52 20,50" fill="#a87442"/>
  <polygon points="9,45 12,46.5 12,49.5 9,48" fill="#6b4224"/>

  <!-- right face (darker) -->
  <polygon points="30,34 54,22 54,48 30,60" fill="#6e4524"/>
  <polygon points="30,34 54,22 54,28 30,40" fill="#438a33"/>
  <polygon points="46,28 50,26 50,30 46,32" fill="#438a33"/>
  <polygon points="36,42 40,40 40,44 36,46" fill="#55351a"/>
  <polygon points="44,44 48,42 48,46 44,48" fill="#8a5a30"/>

  <!-- outline -->
  <polygon points="30,10 54,22 54,48 30,60 6,48 6,22" fill="none" stroke="#1b1f27" stroke-width="2" stroke-linejoin="round"/>
  <polyline points="6,22 30,34 54,22 M30,34 30,60" fill="none" stroke="#1b1f27" stroke-opacity=".35" stroke-width="1"/>

  <!-- AI spark -->
  <circle cx="52" cy="11" r="11" fill="url(#glow)"/>
  <path d="M52 2 L54.2 8.8 L61 11 L54.2 13.2 L52 20 L49.8 13.2 L43 11 L49.8 8.8 Z" fill="#e9fffd" stroke="#4fe0d4" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
