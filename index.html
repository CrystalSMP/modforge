<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModForge AI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12141a; color: #e8ebf2;
      font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 28px; margin: 0 0 8px; } h1 b { color: #5cb85c; }
    p { color: #9aa3b5; margin: 0; }
    .spin { width: 32px; height: 32px; border: 4px solid #2f3646; border-top-color: #5cb85c; border-radius: 50%;
      margin: 20px auto; animation: s 1s linear infinite; } @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <h1>⛏ ModForge <b>AI</b></h1>
    <h2 id="title" style="font-size:20px;margin:16px 0 0;color:#f5c542"></h2>
    <div class="spin" id="spin"></div>
    <p id="msg">Connecting to the server…</p>
  </div>
  <script>
    // Aktuelle Tunnel-Adresse lesen – mehrere Quellen, falls eine begrenzt oder veraltet ist
    const repo = location.pathname.split('/').filter(Boolean)[0];
    const owner = location.hostname.split('.')[0];
    const t = () => Date.now();
    // raw.githubusercontent.com zuerst: kein Abfrage-Limit (die GitHub-API erlaubt nur 60 pro Stunde)
    const SOURCES = [
      () => fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/tunnel.json?t=${t()}`, { cache: 'no-store' }),
      () => fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json?t=${t()}`, { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' }),
      () => fetch(`tunnel.json?t=${t()}`, { cache: 'no-store' }),
    ];
    const msg = (text, spinning) => {
      document.getElementById('msg').textContent = text;
      document.getElementById('spin').style.display = spinning ? '' : 'none';
    };
    const healthy = (url) => fetch(url + '/api/health', { signal: AbortSignal.timeout(8000) }).then((x) => x.ok).catch(() => false);

    async function tryConnect() {
      msg('Connecting to the server…', true);
      // Alle Quellen gleichzeitig abfragen – manche liefern zwischengespeicherte, alte Stände
      const all = (await Promise.all(SOURCES.map((src) => src().then((r) => (r.ok ? r.json() : null)).catch(() => null))))
        .filter(Boolean)
        .sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || ''))); // neueste zuerst

      const s = all[0] || {};
      // 1) Neuester Status = Wartung / eigener Status? Dann den anzeigen (auch wenn der Server noch läuft)
      // 2) Sonst: läuft ein gemeldeter Server wirklich? Dann hin (ältere Quellen können veraltet sein)
      if (!s.maintenance) {
        for (const url of [...new Set(all.filter((x) => x.online && x.url && !x.maintenance).map((x) => x.url))]) {
          if (await healthy(url)) return location.replace(url);
        }
      }
      if (s.maintenance) {
        document.getElementById('title').textContent = s.title || '🛠️ Under maintenance';
        msg(s.message || 'ModForge AI is being improved right now. We will be back soon!', false);
      } else {
        document.getElementById('title').textContent = '😴 Currently offline';
        msg('ModForge AI is not reachable right now. This page reconnects automatically as soon as it is back.', false);
        document.getElementById('msg').insertAdjacentHTML('beforeend', ' <a href="status.html" style="color:#62c45a">Live status →</a>');
      }
      setTimeout(tryConnect, 30000); // alle 30 Sekunden neu prüfen
    }
    tryConnect();
  </script>
</body>
</html>
