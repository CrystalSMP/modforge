<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModForge AI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12141a; color: #e8ebf2;
      font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 28px; margin: 0 0 8px; } h1 b { color: #5cb85c; }
    p { color: #9aa3b5; margin: 0; }
    .spin { width: 32px; height: 32px; border: 4px solid #2f3646; border-top-color: #5cb85c; border-radius: 50%;
      margin: 20px auto; animation: s 1s linear infinite; } @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <h1>⛏ ModForge <b>AI</b></h1>
    <div class="spin" id="spin"></div>
    <p id="msg">Verbinde mit dem Server…</p>
  </div>
  <script>
    // Aktuelle Tunnel-Adresse lesen – mehrere Quellen, falls eine begrenzt oder veraltet ist
    const repo = location.pathname.split('/').filter(Boolean)[0];
    const owner = location.hostname.split('.')[0];
    const t = () => Date.now();
    const SOURCES = [
      () => fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json?t=${t()}`, { headers: { Accept: 'application/vnd.github.raw+json' } }),
      () => fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/tunnel.json?t=${t()}`),
      () => fetch(`tunnel.json?t=${t()}`),
    ];
    const msg = (text, spinning) => {
      document.getElementById('msg').textContent = text;
      document.getElementById('spin').style.display = spinning ? '' : 'none';
    };
    const healthy = (url) => fetch(url + '/api/health', { signal: AbortSignal.timeout(8000) }).then((x) => x.ok).catch(() => false);

    async function tryConnect() {
      msg('Verbinde mit dem Server…', true);
      let sawOffline = false;
      for (const src of SOURCES) {
        try {
          const r = await src();
          if (!r.ok) continue;
          const s = await r.json();
          if (!s.online || !s.url) { sawOffline = true; continue; }
          if (await healthy(s.url)) return location.replace(s.url);
        } catch {}
      }
      msg(sawOffline ? '😴 Die Seite ist gerade offline. Ich versuche es automatisch weiter…'
                     : '⏳ Der Server startet gerade neu. Einen Moment…', false);
      setTimeout(tryConnect, 15000); // alle 15 Sekunden neu versuchen
    }
    tryConnect();
  </script>
</body>
</html>
