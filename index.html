<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ModForge AI</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12141a; color: #e8ebf2;
      font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-size: 28px; margin: 0 0 8px; } h1 b { color: #5cb85c; }
    p { color: #9aa3b5; margin: 0; }
    .spin { width: 32px; height: 32px; border: 4px solid #2f3646; border-top-color: #5cb85c; border-radius: 50%;
      margin: 20px auto; animation: s 1s linear infinite; } @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <h1>⛏ ModForge <b>AI</b></h1>
    <div class="spin" id="spin"></div>
    <p id="msg">Verbinde mit dem Server…</p>
  </div>
  <script>
    // Aktuelle Tunnel-Adresse direkt aus dem Repo lesen (umgeht den Pages-Cache)
    const repo = location.pathname.split('/').filter(Boolean)[0];
    const owner = location.hostname.split('.')[0];
    const offline = (t) => { document.getElementById('spin').remove(); document.getElementById('msg').textContent = t; };
    (async () => {
      try {
        const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json?t=${Date.now()}`,
          { headers: { Accept: 'application/vnd.github.raw+json' } });
        const s = await r.json();
        if (!s.online || !s.url) return offline('😴 Die Seite ist gerade offline. Schau später nochmal vorbei!');
        const ok = await fetch(s.url + '/api/health', { signal: AbortSignal.timeout(8000) }).then((x) => x.ok).catch(() => false);
        if (!ok) return offline('😴 Der Server antwortet gerade nicht. Versuch es in ein paar Minuten nochmal.');
        location.replace(s.url);
      } catch {
        offline('⚠️ Verbindung fehlgeschlagen. Bitte Seite neu laden.');
      }
    })();
  </script>
</body>
</html>
